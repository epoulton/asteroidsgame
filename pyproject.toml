[project]
name = "asteroidsgame"
version = "1.0.0"
description = "A Pygame implementation of the classic arcade game Asteroids."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE.txt" }
dependencies = [
    "numpy==1.26.4",
    "pygame==2.5.2",
    "pygame-menu==3.5.7",
    "scipy==1.11.4",
]

[tool.uv]
package = false
